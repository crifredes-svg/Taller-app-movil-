version: '3.8'

services:
  # Servicio Backend / API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redcuidadora_backend
    restart: always
    ports:
      - "${PORT:-9000}:8000"
    environment:
      DB_HOST: ${DB_HOST:?Configura DB_HOST con el servidor indicado por DevOps}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?Configura DB_USER con los datos indicados por DevOps}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en tu archivo .env local}
      DB_NAME: ${DB_NAME:?Configura DB_NAME con los datos indicados por DevOps}
      JWT_SECRET: ${JWT_SECRET:-tu_clave_secreta_para_desarrollo_local}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
