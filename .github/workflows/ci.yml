name: Continuous Integration

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      PORT: 9000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ci
      DB_PASSWORD: ci
      DB_NAME: ci
      JWT_SECRET: ci-only-secret-key-must-be-at-least-32-bytes-long
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias y ejecutar pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest

      - name: Validar migraciones contra MySQL
        run: alembic upgrade head

      - name: Validar estructura de Docker Compose
        run: docker compose config

      - name: Probar construcción de contenedores Docker
        run: docker compose build